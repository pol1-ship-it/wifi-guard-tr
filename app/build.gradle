plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wifiguard.tr'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wifiguard.tr'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        release {
            def ksPass = System.getenv('KEYSTORE_PASSWORD')
            def keyPass = System.getenv('KEY_PASSWORD')
            def aliasName = System.getenv('KEY_ALIAS')

            storeFile file('release-key.jks')
            storePassword ksPass
            keyAlias aliasName
            keyPassword keyPass
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
