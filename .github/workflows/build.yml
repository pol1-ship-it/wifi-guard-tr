name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release-key.jks

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Read app version
        id: version
        run: |
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Create update metadata
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          VERSION_CODE=$(sed -n "s/.*versionCode \([0-9]*\).*/\1/p" app/build.gradle | head -n 1)
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          SHA256=$(sha256sum "$APK" | awk '{print $1}')

          cat > version.json <<JSON
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "apk": "app-release.apk",
            "sha256": "$SHA256"
          }
          JSON

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Guard-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: WiFi Guard TR v${{ steps.version.outputs.name }}
          body: |
            WiFi Guard TR sürüm ${{ steps.version.outputs.name }}

            APK dosyası ve güvenli güncelleme bilgileri.
          files: |
            app/build/outputs/apk/release/*.apk
            version.json
          fail_on_unmatched_files: true
